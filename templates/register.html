<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CareerX – Placement Assistant</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            min-height: 200vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
            background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.07) 0px, transparent 50%), #F8FAFC;
        }

        .auth-card {
            width: 100%;
            max-width: 560px;
            background: #FFFFFF;
            border: 1px solid rgba(226, 232, 240, 0.95);
            border-radius: 20px;
            padding: 2.5rem 2.25rem;
            box-shadow: 0 20px 40px -15px rgba(79, 70, 229, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.9);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-badge {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4F46E5, #6366F1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 1.45rem;
            margin: 0 auto 1.25rem;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.28);
        }

        .auth-title {
            font-family: var(--font);
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .auth-sub {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-top: 0.35rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
        }

        .form-control:focus {
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        @media (max-width: 580px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .auth-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-badge">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="auth-title">Create Student Profile</h1>
                <p class="auth-sub">Start your placement preparation journey with Career<span
                        style="color: var(--accent);">X</span></p>
            </div>

            <!-- Flash Notifications -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                <i class="fa-solid fa-circle-info"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Username *</label>
                        <input type="text" name="username" class="form-control" placeholder="e.g. rahul_sharma"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. Rahul Sharma">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" name="email" class="form-control" placeholder="name@college.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a secure password"
                        required minlength="6">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">College / University</label>
                        <input type="text" name="college" class="form-control" placeholder="e.g. NIT Trichy">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Branch / Department</label>
                        <input type="text" name="branch" class="form-control" placeholder="e.g. AI & Data Science">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Graduation Year</label>
                        <select name="grad_year" class="form-control">
                            <option value="2024">2024</option>
                            <option value="2025" selected>2025</option>
                            <option value="2026">2026</option>
                            <option value="2027">2027</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Target Role</label>
                        <select name="target_role" class="form-control">
                            <option value="Software Engineer">Software Engineer</option>
                            <option value="AI/ML Engineer">AI/ML Engineer</option>
                            <option value="Full Stack Developer">Full Stack Developer</option>
                            <option value="Data Analyst">Data Analyst</option>
                            <option value="Cloud / DevOps Engineer">Cloud / DevOps Engineer</option>
                            <option value="Cybersecurity Analyst">Cybersecurity Analyst</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; padding: 0.85rem; font-size: 0.95rem; margin-top: 0.5rem;">
                    <span>Complete Registration</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
                Already have an account?
                <a href="{{ url_for('login') }}" style="font-weight: 600; color: var(--accent);">Sign In</a>
            </div>
        </div>
    </div>
</body>

</html>
